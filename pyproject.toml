[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pactkit-codex"
version = "0.2.2"
description = "PactKit PDCA workflow framework adapted for OpenAI Codex CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

authors = [
    { name = "Slim" },
]
keywords = [
    "ai",
    "agent",
    "codex",
    "openai",
    "codex-cli",
    "code-assistant",
    "code-quality",
    "developer-tools",
    "spec-driven",
    "devops",
    "scaffold",
    "tdd",
    "pdca",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
multilang = [
    "tree-sitter>=0.25",
    "tree-sitter-go>=0.25",
    "tree-sitter-java>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.urls]
Homepage = "https://github.com/anthropics/pactkit-codex"
Repository = "https://github.com/anthropics/pactkit-codex"
Documentation = "https://github.com/anthropics/pactkit-codex#readme"
Issues = "https://github.com/anthropics/pactkit-codex/issues"

[project.scripts]
pactkit-codex = "pactkit_codex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pactkit_codex"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/e2e"]
pythonpath = ["src"]
markers = [
    "e2e: End-to-end CLI tests (subprocess-based)",
    "integration: Integration tests that call deploy() with filesystem I/O",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/pactkit_codex/prompts/__init__.py" = ["F401"]
"src/pactkit_codex/prompts/agents.py" = ["E501"]
"src/pactkit_codex/prompts/commands.py" = ["E501"]
"src/pactkit_codex/prompts/references.py" = ["E501"]
"src/pactkit_codex/prompts/rules.py" = ["E501"]
"src/pactkit_codex/prompts/skills.py" = ["E501"]
"src/pactkit_codex/prompts/workflows.py" = ["E501"]
"src/pactkit_codex/generators/deployer.py" = ["E402"]
"src/pactkit_codex/skills/*.py" = ["E501", "E701", "E702", "E722", "E731", "I001"]
"src/pactkit_codex/scripts.py" = ["E501"]
"tests/**/*.py" = ["E402", "E501", "E741", "F841", "I001"]
