[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pactkit-codex"
version = "2.11.0"
description = "PactKit adapter for OpenAI Codex CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pactkit>=2.9.0",
    "tomli>=1.1.0; python_version < '3.11'",
]

authors = [
    { name = "Slim" },
]
keywords = [
    "ai",
    "agent",
    "codex",
    "openai",
    "codex-cli",
    "code-assistant",
    "code-quality",
    "developer-tools",
    "spec-driven",
    "devops",
    "scaffold",
    "tdd",
    "pdca",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/pactkit/pactkit-codex"
Repository = "https://github.com/pactkit/pactkit-codex"
Documentation = "https://github.com/pactkit/pactkit-codex#readme"
Issues = "https://github.com/pactkit/pactkit-codex/issues"

[project.entry-points."pactkit.deployers"]
codex = "pactkit_codex:CodexDeployer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../pactkit/src"]
markers = [
    "e2e: End-to-end CLI tests (subprocess-based)",
    "integration: Integration tests that call deploy() with filesystem I/O",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/pactkit_codex/deployer.py" = ["E501"]
"tests/**/*.py" = ["E402", "E501", "E741", "F841", "I001"]
